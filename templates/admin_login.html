<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | StockPredict AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #080d0b;
            color: white;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle, #123322, #080d0b);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #111c16;
            border: 1px solid #00cc70;
            border-radius: 18px;
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 48px;
            color: #00ff88;
            margin-bottom: 15px;
        }

        .logo h1 {
            color: #00ff88;
            font-size: 27px;
        }

        .logo p {
            color: #a8b9ae;
            margin-top: 8px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            margin-bottom: 9px;
            color: #d5e2d9;
            font-size: 14px;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: #080d0b;
            border: 1px solid #28523a;
            border-radius: 8px;
            padding: 0 14px;
        }

        .input-box i {
            color: #00ff88;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #00cc70;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #00ff88;
            box-shadow: 0 0 18px rgba(0, 255, 136, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #00ff88;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .flash-message {
            padding: 12px;
            margin-bottom: 18px;
            background: #481c22;
            color: #ff8792;
            border-radius: 7px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #82958a;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="login-container">

            <!-- LOGO -->

            <div class="logo">

                <i class="fas fa-user-shield"></i>

                <h1>StockPredict AI</h1>

                <p>Administrator Login Portal</p>

            </div>


            <!-- FLASH MESSAGES -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% for category, message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <!-- LOGIN FORM -->

            <form method="POST"
                  action="{{ url_for('admin_login') }}">

                <div class="input-group">

                    <label>Admin Email</label>

                    <div class="input-box">

                        <i class="fas fa-envelope"></i>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter admin email"
                            required
                            autocomplete="username"
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <div class="input-box">

                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter admin password"
                            required
                            autocomplete="current-password"
                        >

                    </div>

                </div>


                <button type="submit" class="login-btn">

                    <i class="fas fa-sign-in-alt"></i>

                    Login as Admin

                </button>

            </form>


            <a href="{{ url_for('login') }}" class="back-link">

                <i class="fas fa-arrow-left"></i>

                Back to User Login

            </a>


            <div class="footer">

                © 2026 StockPredict AI. All Rights Reserved.

            </div>

        </div>

    </div>

</body>

</html>
